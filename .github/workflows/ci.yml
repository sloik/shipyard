name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libsoup-3.0-dev
      - name: Run canonical quality gate
        run: make quality
      - name: Run parser fuzz regression seed corpora
        run: go test ./cmd/shipyard ./cmd/shipyard-mcp ./internal/auth ./internal/web
      - name: Enforce coverage ratchet
        run: |
          make coverage-check | tee coverage-summary.txt
          {
            echo "## Coverage"
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
