name: Smoke (informational)

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/web/ui/**"
      - "test/smoke/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: make smoke
    runs-on: ubuntu-latest
    # Informational while the browser smoke job proves stable. A failed smoke
    # run should surface on the PR but must not become a merge gate yet.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libsoup-3.0-dev

      - name: Install smoke harness dependencies
        run: npm ci

      - name: Resolve system Chrome
        run: |
          for candidate in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "SMOKE_SKIP_BROWSER=1" >> "$GITHUB_ENV"
          echo "SKIP: no system Chrome/Chromium binary found on runner"

      - name: Run UI smoke harness
        run: |
          if [ "${SMOKE_SKIP_BROWSER:-}" = "1" ]; then
            echo "SKIP: browser unavailable; smoke harness not run"
            exit 0
          fi
          make smoke
