name: Desktop Build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Build desktop binary
        run: wails3 task build

      - name: Package unsigned macOS app
        run: |
          SHIPYARD_VERSION="${{ github.ref_name }}" \
          SHIPYARD_BUILD="${{ github.run_number }}" \
          wails3 task darwin:package

      - name: Show binary size
        run: |
          ls -lh bin/Shipyard.app/Contents/MacOS/shipyard
          du -sh bin/Shipyard.app

      - name: Create zip
        run: |
          cd bin
          zip -r shipyard-macos.zip Shipyard.app

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipyard-macos-${{ github.sha }}
          path: bin/shipyard-macos.zip
