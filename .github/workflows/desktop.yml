name: Desktop Build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build desktop binary
        run: wails3 task build

      - name: Package unsigned macOS app
        run: |
          SHIPYARD_VERSION="${{ github.ref_name }}" \
          SHIPYARD_BUILD="${{ github.run_number }}" \
          wails3 task darwin:package

      - name: Show binary size
        run: |
          ls -lh bin/Shipyard.app/Contents/MacOS/shipyard
          du -sh bin/Shipyard.app

      - name: Create zip
        run: |
          cd bin
          zip -r shipyard-macos.zip Shipyard.app

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: shipyard-macos-${{ github.sha }}
          path: bin/shipyard-macos.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: bin/shipyard-macos.zip
