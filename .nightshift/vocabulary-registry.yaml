version: 1
title: Nightshift canonical vocabulary
source: vocabulary-registry.yaml
concepts:
  - {key: id, label: Spec ID, short_help: Stable identifier for a spec., definition: A unique durable identifier used by dependencies and reports., applicability: [frontmatter, board], values: []}
  - {key: title, label: Title, short_help: Human-readable spec name., definition: The H1 summary of a spec contract., applicability: [spec, board], values: []}
  - {key: type, label: Type, short_help: The kind of work a spec describes., definition: Classifies a specification and selects its completion rules., applicability: [frontmatter, validator, board], values: [feature, bugfix, refactor, main, nfr, research, analysis, task]}
  - {key: status, label: Status, short_help: Stored lifecycle maturity and scheduling intent; not a derived gate., definition: draft is being defined; planned is validated future work; ready is validated current-priority work; blocked is an evidenced critical constraint only., applicability: [frontmatter, validator, board], values: [draft, planned, ready, in_progress, blocked, done, superseded, active, retired]}
  - {key: priority, label: Priority, short_help: Lower number means higher within-layer priority., definition: Scheduling order within a layer; it does not change readiness., applicability: [frontmatter, board], values: []}
  - {key: layer, label: Layer, short_help: "Dependency ordering tier: 0 foundation through 3 polish.", definition: Architectural execution tier used for ordering work., applicability: [frontmatter, board], values: [0, 1, 2, 3]}
  - {key: after, label: Dependencies, short_help: Hard execution dependencies by spec ID., definition: IDs which must be complete before this spec can run., applicability: [frontmatter, dag], values: []}
  - {key: parent, label: Parent, short_help: Grouping parent, not an execution dependency., definition: Parent initiative or NFR hierarchy reference., applicability: [frontmatter, dag, board], values: []}
  - {key: provides, label: Provides, short_help: Capabilities this spec creates., definition: Capability markers produced by the spec., applicability: [frontmatter, dag], values: []}
  - {key: requires, label: Requires, short_help: Capabilities this spec needs., definition: Advisory capability markers, binding only with after., applicability: [frontmatter, dag], values: []}
  - {key: touches, label: Touches, short_help: Likely affected surfaces., definition: Scope markers used for overlap warnings., applicability: [frontmatter, coordinator], values: []}
  - {key: nfrs, label: NFR bindings, short_help: Active quality constraints bound to the spec., definition: NFR IDs that apply as binding constraints., applicability: [frontmatter, validator], values: []}
  - {key: nfr_waivers, label: NFR waivers, short_help: Audited reason an applicable NFR does not bind., definition: Explicit exception record for a mechanically matched NFR., applicability: [frontmatter, validator], values: []}
  - {key: requirements, label: Requirements, short_help: Testable requested outcomes., definition: Contract requirements mapped to acceptance criteria. A normal done spec has every Requirement checkbox checked; validate_specs.py enforces this terminal invariant., applicability: [spec, validator], values: []}
  - {key: acceptance_criteria, label: Acceptance criteria, short_help: Concrete verification conditions., definition: Checkable conditions that prove the contract. A normal done spec has every Acceptance Criterion checkbox checked; validate_specs.py enforces this terminal invariant., applicability: [spec, validator], values: []}
  - {key: evidence, label: Evidence, short_help: Durable proof supporting a result., definition: Test, review, artifact, or trace supporting a decision., applicability: [report, metrics], values: []}
  - {key: verification, label: Verification, short_help: Deterministic checks run against the contract., definition: Validation evidence collected before resolution., applicability: [report, loop], values: []}
  - {key: confidence, label: Confidence, short_help: Diagnostic estimate; never a hidden status transition., definition: Non-authoritative confidence signal for a decision., applicability: [metrics, board], values: []}
  - {key: outcome, label: Outcome, short_help: Result of one run, separate from status., definition: Immutable run result., applicability: [report, metrics], values: [done, partial, blocked, noop]}
  - {key: readiness, label: Readiness, short_help: Deterministic intrinsic contract check., definition: PASS allows admission evaluation; REVIEW preserves ambiguity for a recorded decision; FAIL prevents admission., applicability: [validator, dag, board], values: [PASS, REVIEW, FAIL]}
  - {key: run_state, label: Run state, short_help: Current derived admission or execution condition., definition: Non-durable operational state derived from current evidence; a closed gate never changes stored lifecycle status., applicability: [dag, board], values: [runnable, specification_incomplete, intentionally_future, validation_failed, review_required, waiting_dependencies, waiting_external_input, time_gated, overlap_conflict, dependency_cycle, resource_gated, waiting_gap_spec]}
  - {key: blocker_class, label: Blocker class, short_help: Category of an evidenced exceptional constraint., definition: Classifies a true blocker for metrics and recovery; ordinary dependency and scheduling waits are admission states., applicability: [spec, metrics], values: [technical_infeasibility, safety_constraint, evidence_unavailable, critical_external_constraint, unknown_critical_failure]}
  - {key: blocker_scope, label: Blocker scope, short_help: Whether the blocker belongs to this contract., definition: Scope classification for blocker remediation., applicability: [spec, metrics], values: [in_scope, out_of_scope, mixed, unknown]}
  - {key: block_reason, label: Block reason, short_help: Specific evidence-backed explanation of a blocker., definition: Why an exceptional constraint prevents progress., applicability: [spec, report], values: []}
  - {key: unblock_condition, label: Unblock condition, short_help: Smallest evidence needed to resume safely., definition: Actionable or explicitly unknown condition for recovery., applicability: [spec, report], values: []}
  - {key: prior_attempts, label: Prior attempts, short_help: Durable record of earlier attempts., definition: Historical attempts consulted before retrying work., applicability: [frontmatter, loop], values: []}
  - {key: overrides, label: Overrides, short_help: Explicit, auditable deviations from defaults., definition: Recorded exceptions to configured behavior., applicability: [frontmatter, config], values: []}
  - {key: roles, label: Roles, short_help: Run, worker, orchestrator and parent decision roles., definition: Roles separate execution from coordination and parent resolution., applicability: [protocol, report], values: [run, worker, orchestrator, parent]}
consumers:
  - {name: spec_frontmatter, path: spec_frontmatter.py, bindings: [status]}
  - {name: validate_specs, path: validate_specs.py, bindings: [status, type, nfrs, nfr_waivers]}
  - {name: board, path: board.py, bindings: [status, priority, layer, type]}
  - {name: dag, path: nightshift-dag.py, bindings: [after, parent, status]}
  - {name: protocol, path: LOOP.md, bindings: [outcome, roles, verification]}
  - {name: orchestrator, path: ORCHESTRATOR.md, bindings: [roles, status, verification]}
  - {name: guide, path: SPEC-GUIDE.md, bindings: [type, status, requirements, acceptance_criteria]}
  - {name: git, path: GIT.md, bindings: [status, roles]}
