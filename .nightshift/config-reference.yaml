# =============================================================================
# Nightshift Kit — config.yaml Reference
# =============================================================================
#
# Canonical schema reference for config.yaml. Every field is documented with
# its type, default value, valid options, and usage notes.
#
# This file is a valid YAML document that can be loaded and parsed. It serves
# as both documentation and a complete example of a multi-stack project config.
#
# Kit Version: 2.67.3 (2026-08-09)
# Schema Version: 3.0.0 (multi-stack support)
#
# Backward compatibility:
#   When the `stacks:` section is ABSENT, behavior is identical to v2.2.1.
#   Single-stack projects require no migration and no version bump.
#   The `stacks:` section requires schema_version: "3.0.0" or higher.
#
# =============================================================================

---

# =============================================================================
# Schema Version
# =============================================================================
# Type:     string (SemVer)
# Required: yes
# Default:  "3.0.0"
#
# The SemVer version of the config schema itself. This is distinct from
# kit_version, which tracks the Nightshift protocol/runtime bundle.
#
# 3.0.0 adds multi-stack support. The `stacks:` section is optional; projects
# without it keep flat-command behavior.

schema_version: "3.0.0"

---

# =============================================================================
# Kit Version
# =============================================================================
# Type:     string (SemVer)
# Required: yes
# Default:  none — must be set explicitly
#
# The SemVer version of the Nightshift Kit protocol this config targets.
# Used by the loop and tooling to enable/disable features and validate schema.
#
# Version history:
  # 2.67.3: Canonical payload copy, then separate project config migration.
  # 2.67.2: Explicit operator-authorized legacy managed-payload adoption.
  # 2.67.1: Pre-copy release ownership and deterministic suite recovery (SPEC-207).
  # 2.66.0: Exact historical-checkbox disposition evidence (SPEC-204).
  # 2.65.0: Managed-install provenance audit and direct-edit admission guard (SPEC-203).
  # 2.56.0: Control-board work counts and self-explanatory loop metric hover help (SPEC-144).
  # 2.55.0: Pending draft and ready work tiles (SPEC-142).
#   2.54.0: Static active-NFR reconciliation gate and auditable waivers (SPEC-140).
#   2.53.0: Parent-authoritative kickoff resolution metrics and recovery analytics (SPEC-139-004-001).
#   2.52.0: Bounded parallel orchestration proof and operator guidance (SPEC-139-004).
#   2.49.1: Board status updates write through to spec frontmatter and reconcile newer non-terminal file status.
#   2.49.0: Multi-axis code-generation rubric with Pareto model scorecards (SPEC-108).
#   2.48.0: Trajectory/path evaluation with opt-in expected trajectory assertions (SPEC-107).
#   2.47.0: Failure taxonomy, asymmetric confusion analysis, and tool-call validity metrics (SPEC-106).
#   2.46.0: Loop observability metrics: MTTD, MTTR, CFR, format-failure/easy-fix rates (SPEC-111).
#   2.45.0: Confidence calibration reliability diagram + ECE floor tuning (SPEC-112).
#   2.44.1: Board reconciles stale durable status checkpoints with newer terminal spec frontmatter (SPEC-120).
#   2.44.0: Loop-level caching with prompt-prefix and exact sub-step caches (SPEC-105).
#   2.43.0: Offline replay-eval gate for /evolve protocol changes (SPEC-110).
#   2.42.0: Graded eval metrics and calibrated judge pinning (SPEC-097).
