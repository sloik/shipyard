# Reviewed static-analysis policy for SPEC-BUG-158.
#
# "all" enables Staticcheck bug/correctness (SA), simplification/inefficiency
# (S), style (ST), and unused-code (U) checks. Go vet runs separately through
# `make type-check`; this file intentionally has no blanket suppressions or
# directory exclusions. A future exception must name the exact rule/location,
# explain why it is safe, and state its removal/review condition in this file.
checks = ["all"]
