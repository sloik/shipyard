version: 2
project_name: shipyard

# NOTE: This builds the headless/CLI binary (CGO_ENABLED=0).
# Desktop .app builds require Wails v3 and live in the macOS desktop workflow:
#   make package-macos
#   make sign-macos / make notarize-macos
builds:
  - main: ./cmd/shipyard
    binary: shipyard
    # The headless build: without this tag cmd/shipyard pulls in the Wails
    # desktop runtime, which needs cgo and cannot build with CGO_ENABLED=0.
    tags:
      - server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^nightshift:"

release:
  github:
    owner: sloik
    name: shipyard
